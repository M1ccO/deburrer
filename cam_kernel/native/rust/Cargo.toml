[package]
name = "cam-kernel-native"
version = "0.1.0"
edition = "2021"
description = "Performance-critical Rust modules for the CAM kernel"

[lib]
name = "cam_kernel_native"
crate-type = ["cdylib"]

[dependencies]
nalgebra = "0.32"
numpy = "0.21"
pyo3 = { version = "0.21", features = ["extension-module"] }
