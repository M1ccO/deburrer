<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FreeCAD-Style 3D G-code Viewer (Orthographic)</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #eee;
    font-family: Arial, sans-serif;
  }
  #top {
    padding: 10px;
  }
  textarea {
    width: 100%;
    height: 120px;
    resize: vertical;
    background: #111;
    color: #eee;
    border: 1px solid #555;
    font-family: Consolas, monospace;
    padding: 6px;
  }
  button {
    margin-right: 4px;
    padding: 4px 8px;
  }
  #viewer {
    width: 100vw;
    height: calc(100vh - 240px);
    background: #111;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="top">
  <h2 style="margin:5px 0;">FreeCAD-Style 3D G-code Viewer (Orthographic)</h2>

  <button id="renderBtn">Render 3D</button>

  <button class="viewBtn" data-view="iso">3D</button>
  <button class="viewBtn" data-view="top">Top</button>
  <button class="viewBtn" data-view="bottom">Bottom</button>
  <button class="viewBtn" data-view="front">Front</button>
  <button class="viewBtn" data-view="back">Back</button>
  <button class="viewBtn" data-view="left">Left</button>
  <button class="viewBtn" data-view="right">Right</button>

  <textarea id="gcodeInput"></textarea>

  <p style="font-size:12px;color:#bbb;margin-top:6px;">
    **Mouse Controls (FreeCAD CAD Mode)**  
    Left-drag = Rotate · Middle-drag = Pan  
    Shift+Left = Pan · Ctrl+Left = Zoom · Wheel = Zoom  
    Orthographic view with stable up-direction.
  </p>
</div>

<div id="viewer"><canvas id="canvas"></canvas></div>

<script>
// ======== DEMO GCODE ========
const demo = `
G00 X0 Y0 Z0
G01 X10 Y0 Z0
G01 X10 Y10 Z-5
G01 X0  Y10 Z-5
G01 X0  Y0  Z0
`;
document.getElementById("gcodeInput").value = demo.trim();

let canvas = document.getElementById("canvas");
let viewer = document.getElementById("viewer");
let ctx;

// Camera state
let target = { x:0, y:0, z:0 };
let camDist = 150;   // orthographic zoom base
let yaw = Math.PI * 0.75;
let pitch = -0.6;

// Mouse state
let dragging = false;
let dragMode = "rotate"; // rotate/pan/zoom
let lastX = 0, lastY = 0;

let points3D = [];

// ======== INITIALIZE ===========
function resizeCanvas() {
  canvas.width = viewer.clientWidth;
  canvas.height = viewer.clientHeight;
}

function init() {
  resizeCanvas();
  ctx = canvas.getContext("2d");

  window.addEventListener("resize", () => {
    resizeCanvas();
    draw();
  });

  canvas.addEventListener("mousedown", e => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;

    if (e.button === 1) dragMode = "pan"; // middle mouse
    else if (e.shiftKey) dragMode = "pan";
    else if (e.ctrlKey) dragMode = "zoom";
    else dragMode = "rotate";
  });

  window.addEventListener("mouseup", () => dragging = false);

  window.addEventListener("mousemove", e => {
    if (!dragging) return;
    let dx = e.clientX - lastX;
    let dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    if (dragMode === "rotate") {
      yaw += dx * 0.01;
      pitch += dy * 0.01;
      pitch = Math.max(Math.min(pitch, Math.PI/2 * 0.99), -Math.PI/2 * 0.99);
    }
    else if (dragMode === "pan") {
      let f = camDist * 0.005;
      let right = { x: Math.cos(yaw), y:0, z:-Math.sin(yaw) };
      let up = { x:0, y:1, z:0 };
      target.x -= right.x * dx * f;
      target.y += up.y * dy * f;
      target.z -= right.z * dx * f;
    }
    else if (dragMode === "zoom") {
      camDist *= (1 - dy * 0.01);
      camDist = Math.max(5, Math.min(camDist, 1000));
    }

    draw();
  });

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    camDist *= (1 + e.deltaY * 0.001);
    camDist = Math.max(5, Math.min(camDist, 1000));
    draw();
  }, { passive:false });
}

// ======== PARSE GCODE ===========
function parseGCode(txt) {
  let lines = txt.split(/\r?\n/);
  let pts = [];
  let x=0,y=0,z=0;

  for (let raw of lines) {
    raw = raw.split(/[;(]/)[0].trim();
    if (!raw) continue;

    let mX = raw.match(/X(-?\d+\.?\d*)/i);
    let mY = raw.match(/Y(-?\d+\.?\d*)/i);
    let mZ = raw.match(/Z(-?\d+\.?\d*)/i);

    if (mX) x = parseFloat(mX[1]);
    if (mY) y = parseFloat(mY[1]);
    if (mZ) z = parseFloat(mZ[1]);

    if (mX||mY||mZ) pts.push({x,y,z});
  }
  return pts;
}

// ======== NORMALIZE POINTS ===========
function normalize(raw) {
  let minX=raw[0].x, maxX=raw[0].x;
  let minY=raw[0].y, maxY=raw[0].y;
  let minZ=raw[0].z, maxZ=raw[0].z;

  for (let p of raw) {
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y);
    minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z);
  }

  let cx = (minX+maxX)/2;
  let cy = (minY+maxY)/2;
  let cz = (minZ+maxZ)/2;
  target = { x:cx, y:cy, z:cz };

  let scale = 1;
  let size = Math.max(maxX-minX,maxY-minY,maxZ-minZ);
  if (size > 0) scale = 100/size;

  return raw.map(p=>({
    x:(p.x-cx)*scale,
    y:(p.y-cy)*scale,
    z:(p.z-cz)*scale
  }));
}

// ======== ORTHOGRAPHIC PROJECTION ===========
function project(p) {
  let cosy = Math.cos(yaw), siny = Math.sin(yaw);
  let cosp = Math.cos(pitch), sinp = Math.sin(pitch);

  let dx = p.x;
  let dy = p.y;
  let dz = p.z;

  // rotate around Y
  let x1 = dx * cosy + dz * siny;
  let z1 = -dx * siny + dz * cosy;

  // rotate around X
  let y2 = dy * cosp - z1 * sinp;

  return {
    x: canvas.width/2 + x1 * (200/camDist),
    y: canvas.height/2 - y2 * (200/camDist)
  };
}

// ======== DRAW ===========
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // === ORIGIN AXES HERE ===
  const AX = 40; // length in model units
  const origin = project({ x: 0,  y: 0,  z: 0 });
  const xAxis  = project({ x: AX, y: 0,  z: 0 });
  const yAxis  = project({ x: 0,  y: AX, z: 0 });
  const zAxis  = project({ x: 0,  y: 0,  z: AX });

  // X axis (red)
  ctx.strokeStyle = "#ff4444";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(xAxis.x, xAxis.y);
  ctx.stroke();

  // Y axis (green)
  ctx.strokeStyle = "#44ff44";
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(yAxis.x, yAxis.y);
  ctx.stroke();

  // Z axis (blue)
  ctx.strokeStyle = "#4444ff";
  ctx.beginPath();
  ctx.moveTo(origin.x, origin.y);
  ctx.lineTo(zAxis.x, zAxis.y);
  ctx.stroke();

  // === TOOLPATH (AQUA) ===
  if (points3D.length < 2) return;

  ctx.strokeStyle = "#00e5ff";
  ctx.lineWidth = 2;
  ctx.beginPath();
  let p0 = project(points3D[0]);
  ctx.moveTo(p0.x, p0.y);
  for (let i = 1; i < points3D.length; i++) {
    let p = project(points3D[i]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // === POINTS (YELLOW) ===
  ctx.fillStyle = "#ffcc00";
  for (let pt of points3D) {
    let p = project(pt);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ======== SNAP VIEW BUTTONS ===========
function setView(v) {
  if (v==="top")      { yaw = 0; pitch = -Math.PI/2; }
  if (v==="bottom")   { yaw = 0; pitch =  Math.PI/2; }
  if (v==="front")    { yaw = 0; pitch = 0; }
  if (v==="back")     { yaw = Math.PI; pitch = 0; }
  if (v==="left")     { yaw = -Math.PI/2; pitch=0; }
  if (v==="right")    { yaw =  Math.PI/2; pitch=0; }
  if (v==="iso")      { yaw = -Math.PI*0.75; pitch=-0.6; }

  draw(

);
}

// ======== MAIN ===========
init();

document.getElementById("renderBtn").onclick = () => {
  let raw = parseGCode(document.getElementById("gcodeInput").value);
  if (!raw.length) return;
  points3D = normalize(raw);
  draw();
};

document.querySelectorAll(".viewBtn").forEach(btn=>{
  btn.onclick = ()=> setView(btn.dataset.view);
});

// First render
document.getElementById("renderBtn").click();
</script>

</body>
</html>
